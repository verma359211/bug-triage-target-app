name: Reproduction

run-name: repro-${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique reproduction run identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run reproduction
        continue-on-error: true
        run: npx jest repro --json --outputFile=result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
          retention-days: 1

